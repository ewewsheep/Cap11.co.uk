<body>
    <div id="InterDiv" style="width:100%"></div>
    <div id="ContentDiv" style="width:100%"></div>
    <script>
        async function Run(){
        let response = await fetch("Trade.json");
        let a = await response.json();
        a.forEach(b => {
            document.getElementById("ContentDiv").innerHTML += `<div class='box text1' style='height:10em;display:flex;flex-direction:column'>    <span>Name: ${b.name}</span>    <span>Game: ${b.platform}</span>    <span>Giving: ${b.giving}</span>    <span>For: ${b.for}</span>    </div>`
        })
        }

        Run()
    </script>
</body>
