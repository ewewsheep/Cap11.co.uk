<head>
    <link rel="icon" href="/favcon.ico">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" ></script>
    <script>
        headerscr()
    </script></head>
<body>
    <div id="InterDiv" style="width:100%"></div>
    <h1>TRADING HUB</h1>
    <h3>Trade at your own risk</h3>
    <h6>any scamming or fowl play will result with a permanent ban (keep a video for apeal proof or report proof)</h6>
    <br>
    <br>
    <a href="Trade.html"   style="flex:1; color:White;" class="headerlink">Trade</a>
    <br>
    <br>
    <br>
    <div id="ContentDiv" style="display:flex;width:100%;justify-content:center;flex-direction:column"></div>
    <script>
        async function Run(){
        let response = await fetch("Trade.json");
        let a = await response.json();
        a.forEach(b => {
            document.getElementById("ContentDiv").innerHTML += `<div class='box text1' style='height:10em;display:flex;flex-direction:column'>    <span>Name: ${b.name}</span>    <span>Game: ${b.platform}</span>    <span>Giving: ${b.giving}</span>    <span>For: ${b.for}</span>    <span>Contact: ${b.cinfo}</span>    </div>`
        })
        }

        Run()
    </script>
</body>
