<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="/favcon.ico">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" ></script>

  <script>
    headerscr()
  </script>

  <style>
    .unblur {
      filter: blur(0)
    }
    .blur {
      filter: blur(10px)
    }
  </style>
</head>

<body style="display:flex;align-items:center;justify-content:center;flex-direction:column;">

<div id="InterDiv" style="width:100%"></div>

<span style="font-size:5em;font-family:'Courier New', Courier, monospace;text-decoration:wavy;">
  Poetry Club
</span>

<div style="height:15em;padding:1.5em;gap:2em;display:flex;flex-direction:row" class="box text1">
  <div style="display:flex;flex-direction:column;">
    <span>NAME: Poetry</span>
    </button>
    <p>Description: this is a club where you do or read poerty</p>
    <button class="joinbutton" onclick="addclub('Poetry')"> JOIN </button>
  </div>

  <img src="https://wallpapercave.com/wp/wp4356823.jpg"
       style="width:500px;align-self:flex-start;">
</div>

<div id="hidebox" style="display:flex;flex-direction:row;height:10em;padding:1.5em;gap:2em;align-items:center;justify-content:center;" class="blur box text1">
  <span>Weekly poem: The lady of Shallot, which represents a struggling artist</span>
</div>

<script>
  setTimeout(() => {
    IfClub("Poetry", () => {
      const box = document.getElementById("hidebox");
      box.classList.remove("blur");
      box.classList.add("unblur");
    });
  }, 1000);
</script>

</body>
</html>
