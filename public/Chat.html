<body>
  <div id="InterDiv" style="width:100%"></div>
  <h1>Chat</h1>
  <h3>MUST READ: IF YOU PUT ANY INAPROPRIATE CONTENT YOU WILL BE PERMENANTLY BANNED WITH NO APPEAL</h3>
  <div id="ContentDiv" style="width:100%"></div>
  <div style="width:100%; height:10em; display:flex;">
  <input type="text" id="msbox" placeholder="message" style="height:100%; width:100%; font-size:xx-large;">
  <button style="height:100%; width:5em; font-size:xx-large;" onclick="cChat()">→</button>
</div>
    <script>
        async function Update() {
    let response = await fetch("Chat.json");
    let a = await response.json();

    a.forEach(b => {
        if (b.id > zelta) {
            document.getElementById("ContentDiv").innerHTML += `
                <div class='box text1' style='height:10em;display:flex;flex-direction:column'>
                    <span>Name: ${b.name}</span>
                    <span>Rank: ${b.rank}</span>
                    <h3>Message: ${b.message}</h3>
                </div>`;
            zelta += 1;
        }
    });
}
        setInterval(() => {Update()},100)
    </script>
</body>
